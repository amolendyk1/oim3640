!DOCTYPE html>
<html>
<head>
    <title>MBTA Result</title>
</head>
<body>
    <h1>Results for "{{ place }}"</h1>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% else %}
        <p><strong>Nearest Stop:</strong> {{ stop_name }}</p>
        <p><strong>Wheelchair Accessible:</strong> {{ wheelchair }}</p>
    {% endif %}

    <a href="/">Search again</a>
</body>
</html>
